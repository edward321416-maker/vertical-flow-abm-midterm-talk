      reps.forEach((id) => { const g = by[id]; U.push([1,2,3,4,5,6,7,8].map((b) => +g[b].U)); EV.push([1,2,3,4,5,6,7,8].map((b) => +g[b].U_elev / +g[b].U)); ES.push([1,2,3,4,5,6,7,8].map((b) => +g[b].U_esc / +g[b].U)); });
      for (let b = 1; b <= 8; b++) {
        const n = reps.length, m = {}; ['U', 'U_esc', 'U_stairs', 'U_elev'].forEach((c) => { m[c] = reps.reduce((s, id) => s + +by[id][b][c], 0) / n; });
        const us = U.map((r) => r[b - 1]), mean = m.U, sd = Math.sqrt(us.reduce((s, u) => s + (u - mean) ** 2, 0) / (n - 1));
        const xs = reps.map((id) => +by[id][b].x_upper);
        bnds.push({ b, label: b + '→' + (b + 1) + 'F', label_ko: b + '→' + (b + 1) + '층', flow: Math.round(mean), flow_mean: mean, flow_sd: sd, flow_p05: quant(us, .05), flow_p95: quant(us, .95),
          anchor: Math.round(xs.reduce((s, v) => s + v, 0) / xs.length * 100) / 100, esc: m.U_esc, stairs: m.U_stairs, elev: m.U_elev, esc_share: m.U_esc / mean, elev_share: m.U_elev / mean,
          dominant_mode: m.U_esc > m.U_elev ? 'ESC' : 'ELV', retention_pct: prev === null ? null : (Math.round(mean) / prev - 1) * 100 });
        prev = Math.round(mean);
      }
      out.scenarios[k] = { id: cells[k], name: DATA.scenarios[k].name, n_runs: reps.length, boundaries: bnds, runs: { U, elev_share: EV, esc_share: ES } };
    }
    return out;
  }

  // ---------------------------------------------------------------- SVG helpers
  const S = [];
  const T = (x, y, s, o) => { o = o || {}; S.push('<text x="' + x + '" y="' + y + '" font-family="' + FONT + '" font-size="' + (o.size || 24) + '" font-weight="' + (o.w || 400) + '" fill="#fff" fill-opacity="' + (o.a == null ? 0.85 : o.a) + '"' + (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') + (o.ls ? ' letter-spacing="' + o.ls + '"' : '') + (o.halo ? ' stroke="#050505" stroke-width="6" stroke-linejoin="round" paint-order="stroke"' : '') + '>' + esc(s) + '</text>'); };
  const L = (x1, y1, x2, y2, a, dash) => S.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#fff" stroke-opacity="' + a + '" stroke-width="1"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>');
  const R = (x, y, w, h, a, fill) => S.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + (fill ? '#fff' : 'none') + '" fill-opacity="' + (fill ? a : 1) + '" stroke="' + (fill ? 'none' : '#fff') + '" stroke-opacity="' + a + '" stroke-width="1"/>');
  const C = (x, y, r, a, fill) => S.push('<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (fill ? '#fff' : 'none') + '" fill-opacity="' + (fill ? a : 1) + '" stroke="#fff" stroke-opacity="' + a + '" stroke-width="1.4"/>');
  const xs = (i) => X0 + i * DX;

  function buildHUD() {
    S.length = 0;
    const A = DATA.scenarios.A.boundaries, B = DATA.scenarios.B.boundaries;
    const maxFlow = Math.max.apply(null, A.concat(B).map((d) => d.flow));
    const kh1 = 1000 / maxFlow, base1 = 1900;
    // orthogonal hairline grid + station lines + zone rules
    for (let i = 0; i < 8; i++) L(xs(i), 70, xs(i), 4130, 0.1, '2 8');
    [ZONE.z2[0], ZONE.z3[0], ZONE.z4[0]].forEach((y) => L(60, y, W - 60, y, 0.22));
    L(60, 60, W - 60, 60, 0.22); L(60, 4140, W - 60, 4140, 0.22);
    for (let x = 60; x <= W - 60; x += 60) { L(x, 56, x, 66, 0.3); L(x, 4134, x, 4144, 0.3); }
    // ---- ZONE 1: header, scale, micro-log, hero
    T(100, 112, 'VERTICAL CHOREOGRAPHIES // AIK_BOUNDARY_REP // γ=4 // N=100', { size: 30, w: 700, a: 0.95 });
    T(100, 156, DATA.meta.subtitle, { size: 24, a: 0.6 });
    [['A · TOP-HEAVY ANCHOR', 100], ['B · BOTTOM-HEAVY ANCHOR', 520]].forEach((b) => { R(b[1], 186, b[0].length * 17 + 30, 40, 0.55); T(b[1] + 15, 213, b[0], { size: 22, a: 0.9 }); });
    T(100, 330, 'VERTICAL', { size: 92, w: 800, a: 0.96, ls: 6 });
    T(100, 428, 'CHOREOGRAPHIES', { size: 92, w: 800, a: 0.96, ls: 6 });
    const ticks = [B[0].flow, A[0].flow, A[1].flow, A[7].flow, B[3].flow, B[7].flow];
    ticks.forEach((v) => { const y = base1 - v * kh1; L(300, y, W - 100, y, 0.09, '3 9'); T(100, y + 8, fmt(v), { size: 24, a: 0.85 }); L(240, y, 300, y, 0.5); });
    T(100, 1960, 'FLOW (PERSONS / 4 DAYS, MEAN OF 100 RUNS) ↑', { size: 20, a: 0.45 });
    // micro-log table
    const tx = [1500, 1700, 2000];
    T(tx[0], 112, 'BOUNDARY', { size: 22, a: 0.55 }); T(tx[1] + 90, 112, 'FLOW_AVG', { size: 22, a: 0.55, anchor: 'end' }); T(tx[2], 112, 'ANCHOR_γ_MODE', { size: 22, a: 0.55 });
    L(tx[0], 126, 2300, 126, 0.35);
    ['A', 'B'].forEach((k, ki) => DATA.scenarios[k].boundaries.forEach((d, i) => {
      const y = 166 + (ki * 8 + i) * 36;
      T(tx[0], y, k + ' ' + d.label, { size: 26, a: 0.9 }); T(tx[1] + 90, y, fmt(d.flow), { size: 26, a: 0.95, anchor: 'end' }); T(tx[2], y, d.anchor.toFixed(2) + ' ' + d.dominant_mode, { size: 26, a: 0.9 });
      if (i === 7) L(tx[0], y + 12, 2300, y + 12, 0.18);
    }));
    const b34 = B[2].flow, b45 = B[3].flow, cliff = (b45 / b34 - 1) * 100;
    T(tx[0], 868, cliff.toFixed(1) + '%', { size: 150, w: 800, a: 0.97 });
    T(tx[0], 912, 'B CLIFF // ' + B[2].label + ' ' + fmt(b34) + ' → ' + B[3].label + ' ' + fmt(b45), { size: 24, a: 0.8 });
    // ---- ZONE 2: telemetry matrix
    T(100, 2062, 'TELEMETRY MATRIX // A vs B // 8 FLOOR TRANSITIONS', { size: 26, w: 700, a: 0.9 });
    for (let i = 0; i < 8; i++) { T(xs(i), 2108, A[i].label, { size: 26, w: 700, anchor: 'middle', a: 0.95 }); T(xs(i), 2134, A[i].label_ko || DATA.labels_ko[i], { size: 20, anchor: 'middle', a: 0.5 }); }
    L(100, 2146, W - 100, 2146, 0.3);
    [['A', 2180, A], ['B', 2404, B]].forEach((g) => {
      T(100, g[1], (g[0] === 'A' ? 'A · TOP-HEAVY' : 'B · BOTTOM-HEAVY'), { size: 22, w: 700, a: 0.9 });
      const rows = ['FLOW', 'ANCHOR', 'ESC/ELV %', 'Δ% vs PREV'];
      rows.forEach((r, ri) => {
        const y = g[1] + 44 * (ri + 1);
        T(100, y, r, { size: 20, a: 0.5 });
        L(100, y + 14, W - 100, y + 14, 0.08);
        g[2].forEach((d, i) => {
          const x = xs(i);
          if (ri === 0) T(x, y, fmt(d.flow), { size: 28, w: 700, anchor: 'middle', a: 0.97 });
          if (ri === 1) T(x, y, d.anchor.toFixed(2), { size: 28, anchor: 'middle', a: d.anchor >= 0.3 ? 1 : 0.6, w: d.anchor >= 0.3 ? 700 : 400 });
          if (ri === 2) { T(x - 52, y, Math.round(d.esc_share * 100) + '/' + Math.round(d.elev_share * 100), { size: 22, anchor: 'start', a: 0.85 }); R(x + 22, y - 12, 52, 6, 0.5); R(x + 22, y - 12, 52 * d.esc_share, 6, 0.8, true); }
          if (ri === 3) T(x, y, d.retention_pct === null ? '—' : (d.retention_pct < 0 ? '▼ ' : '▲ ') + d.retention_pct.toFixed(1) + '%', { size: 24, anchor: 'middle', a: 0.85 });
        });
      });
    });
    // ---- ZONE 3: needles, badge, hero
    const kh3 = 330 / maxFlow, base3 = 3450;
    R(100, 2640, 540, 44, 0.6); T(116, 2670, 'SCENARIO B DECAY // A−B DIVERGENCE', { size: 22, a: 0.95 });
    const rebound = (A[7].flow / A[5].flow - 1) * 100;
    T(100, 2860, '+' + rebound.toFixed(1) + '%', { size: 190, w: 800, a: 0.97 });
    T(100, 2912, 'A ' + A[5].label + ' ' + fmt(A[5].flow) + ' → ' + A[7].label + ' ' + fmt(A[7].flow) + ' // TOP ANCHOR ' + A[7].anchor.toFixed(2) + ' REBOUND', { size: 24, a: 0.8 });
    T(100, 2948, 'LOCAL STEP ' + A[6].label + ' → ' + A[7].label + ': ' + (A[7].flow / A[6].flow * 100 - 100 >= 0 ? '+' : '') + ((A[7].flow / A[6].flow - 1) * 100).toFixed(1) + '%', { size: 20, a: 0.5 });
    for (let i = 0; i < 8; i++) {
      const yb = base3 - B[i].flow * kh3, ya = base3 - A[i].flow * kh3, x = xs(i);
      L(x, yb, x, ya, 0.55); C(x, ya, 8, 0.9, false); C(x, yb, 4, 0.95, true);
      const dlt = A[i].flow - B[i].flow;
      T(x + 16, Math.min(ya, yb) - 14, 'Δ ' + (dlt >= 0 ? '+' : '−') + fmt(Math.abs(dlt)), { size: 20, a: 0.9, halo: true });
    }
    T(100, 3470, '○ A FLOW   ● B FLOW   │ Δ = A − B (PERSONS)', { size: 20, a: 0.55 });
    // ---- ZONE 4: needle histogram + threshold scatter
    T(100, 3600, 'MODAL SPLIT NEEDLES // 2 SCENARIOS × 8 BOUNDARIES × 10 RUN-DECILES = 160 BARS', { size: 22, w: 700, a: 0.9 });
    const hb = 3890; L(100, hb, 1180, hb, 0.35);
    T(100, 3664, '↑ ELV SHARE', { size: 18, a: 0.5 }); T(100, 4122, '↓ ESC SHARE', { size: 18, a: 0.5 });
    let bi = 0;
    ['A', 'B'].forEach((k) => {
      const sc = DATA.scenarios[k];
      for (let b = 0; b < 8; b++) {
        const order = sc.runs.U.map((r, i) => [r[b], i]).sort((p, q) => p[0] - q[0]);
        for (let d = 0; d < 10; d++) {
          const grp = order.slice(d * 10, d * 10 + 10).map((p) => p[1]);
          const ev = grp.reduce((s, i) => s + sc.runs.elev_share[i][b], 0) / grp.length, es = grp.reduce((s, i) => s + sc.runs.esc_share[i][b], 0) / grp.length;
          const x = 100 + bi * 6.5 + (bi >= 80 ? 40 : 0) + 3;
          L(x, hb, x, hb - ev * 260, 0.95); L(x, hb, x, hb + es * 260, 0.45);
          bi++;
        }
        if (b % 2 === 0) T(100 + (bi - 10) * 6.5 + (bi - 10 >= 80 ? 40 : 0), 4150 - 6, sc.boundaries[b].label, { size: 15, a: 0.45 });
      }
      T(100 + (k === 'A' ? 0 : 80 * 6.5 + 40), 3640, k, { size: 24, w: 800, a: 0.95 });
    });
    // threshold scatter
    const tiers = [0.85, 0.45, 0.11, 0.05], gx0 = 1500, gp = 96, ty = [3700, 3780, 3860, 3940, 4040];
    T(1320, 3600, 'ANCHOR TIERS & ELV/ESC TRANSITION // 8 BOUNDARIES', { size: 22, w: 700, a: 0.9 });
    ty.forEach((y, i) => { L(1320, y, 2300, y, 0.28, '6 8'); T(1320, y - 10, i < 4 ? 'ANCHOR ' + tiers[i].toFixed(2) : 'ELV = ESC (50%)', { size: 18, a: 0.55 }); });
    for (let b = 0; b < 8; b++) {
      const x = gx0 + b * gp + 70;
      T(x, 4130, A[b].label, { size: 15, anchor: 'middle', a: 0.45 });
      [['A', A], ['B', B]].forEach((g, gi) => {
        const d = g[1][b], ti = tiers.findIndex((t) => Math.abs(t - d.anchor) < 0.005);
        const off = gi === 0 ? -9 : 9;
        const yy = ti >= 0 ? ty[ti] : ty[0];
        if (gi === 0) S.push('<rect x="' + (x + off - 6) + '" y="' + (yy - 6) + '" width="12" height="12" fill="#fff" fill-opacity="0.95"/>'); else C(x + off, yy, 7, 0.9, false);
        const ye = ty[4] - (d.elev_share - 0.5) * 110;
        if (gi === 0) S.push('<rect x="' + (x + off - 6) + '" y="' + (ye - 6) + '" width="12" height="12" fill="#fff" fill-opacity="0.95"/>'); else C(x + off, ye, 7, 0.9, false);
      });
    }
    T(2300, 3600 + 0, '■ A   ○ B', { size: 20, anchor: 'end', a: 0.6 });
    hud.innerHTML = S.join('');
    return { kh1, base1, kh3, base3 };
  }

  // ---------------------------------------------------------------- canvas
  function render() {
    const t0 = performance.now();
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
    const A = DATA.scenarios.A, B = DATA.scenarios.B;
    const g = buildHUD();
    const rng = E.mulberry32(SEED), noise = E.makeSimplex1D(E.mulberry32(SEED + 11));
    const sdB = B.boundaries.map((d) => d.flow_sd), sdA = A.boundaries.map((d) => d.flow_sd);
    const byTypical = (sc) => {                         // nearest slice = the run closest to the 100-run mean profile
      const mean = sc.boundaries.map((d) => d.flow_mean);
      return sc.runs.U.map((r, i) => [r.reduce((q, v, b) => q + (v - mean[b]) * (v - mean[b]) / (sc.boundaries[b].flow_sd ** 2 || 1), 0), i]).sort((p, q) => p[0] - q[0]).map((p) => sc.runs.U[p[1]]);
    };
    const runsA = byTypical(A), runsB = byTypical(B);
    const xEnd = X0 + 7 * DX + 6;
    const z1B = { x: 0, y: 0, w: xEnd, h: ZONE.z1[1] }, z1A = { x: 0, y: 0, w: xEnd, h: ZONE.z1[1] };
    // background shadow spire ridge = scenario B
    const sB = E.drawRidgeStack(ctx, { runs: runsB, sds: sdB, kh: g.kh1, x0: X0, dx: DX, baseY: g.base1, zx: 1.1, zy: 1.5, z0: 130, rng, noise, occluder: 0.95, clip: z1B,
      contourEvery: 0, contourAlpha: 0.2, ampFrac: 0.35, samples: 420,
      strip: { count: 5, tau: 1.6, maxD: 4, alpha: [0.26, 0.5], size: 1.0 },
      face: { samples: 1100, count: 110, tau: 210, maxD: 760, alpha: [0.05, 0.4], size: 1.0 } });
    // foreground illuminated ridge = scenario A
    const sA = E.drawRidgeStack(ctx, { runs: runsA, sds: sdA, kh: g.kh1, x0: X0, dx: DX, baseY: g.base1, zx: 1.1, zy: 1.5, z0: 0, rng, noise, occluder: 0.97, clip: z1A,
      contourEvery: 10, contourAlpha: 0.22, ampFrac: 0.3, samples: 420,
      strip: { count: 4, tau: 1.8, maxD: 4.5, alpha: [0.6, 0.98], size: 1.2 },
      face: { samples: 1300, count: 95, tau: 125, maxD: 520, alpha: [0.03, 0.98], size: 1.1 } });
    // secondary dithered horizon (zone 3): scenario B decay
    const z3 = { x: 0, y: ZONE.z3[0], w: xEnd, h: ZONE.z3[1] - ZONE.z3[0] };
    const s3 = E.drawRidgeStack(ctx, { runs: runsB, sds: sdB, kh: g.kh3, x0: X0, dx: DX, baseY: g.base3, zx: 0.5, zy: 0.35, z0: 0, rng, noise, occluder: 0.96, clip: z3,
      contourEvery: 12, contourAlpha: 0.2, ampFrac: 0.4, samples: 420,
      strip: { count: 3, tau: 1.0, maxD: 3, alpha: [0.35, 0.9], size: 1.1 },
      face: { samples: 1100, count: 60, tau: 80, maxD: 320, alpha: [0.04, 0.9], size: 1.0 } });
    stats.durationMs = Math.round(performance.now() - t0);
    stats.particles = { B_spire: sB.particles, A_massif: sA.particles, zone3: s3.particles, total: sB.particles + sA.particles + s3.particles };
    stats.resolution = W + 'x' + H;
    stats.hash = E.fnv1a(cv.toDataURL('image/png').slice(-4000)) + '-' + E.fnv1a(hud.innerHTML);
    window.__posterReady = true;
    return stats;
  }

  // ---------------------------------------------------------------- export
  function serializeHud() {
    const s = new XMLSerializer().serializeToString(hud);
    return s.indexOf('xmlns=') < 0 ? s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"') : s;
  }
  function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function svgImage(text) { return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text); }); }
  async function composite() {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.drawImage(cv, 0, 0);
    x.drawImage(await svgImage(serializeHud().replace('<svg ', '<svg width="' + W + '" height="' + H + '" ')), 0, 0, W, H);
    return c;
  }
  async function exportPNG() {
    document.body.classList.add('exporting');
    try { const c = await composite(); const blob = await new Promise((r) => c.toBlob(r, 'image/png')); download(blob, 'vertical_choreographies_2400x4200.png'); statusEl.textContent = 'PNG exported'; }
    finally { document.body.classList.remove('exporting'); }
  }
  function exportSVG() { download(new Blob([serializeHud()], { type: 'image/svg+xml' }), 'vertical_choreographies_hud.svg'); statusEl.textContent = 'SVG exported'; }

  // ---------------------------------------------------------------- data binding check (every number drawn must come from DATA)
  function verifyBinding() {
    const text = hud.textContent, miss = [];
    ['A', 'B'].forEach((k) => DATA.scenarios[k].boundaries.forEach((d) => { if (text.indexOf(fmt(d.flow)) < 0) miss.push(k + d.label + ' flow ' + fmt(d.flow)); if (text.indexOf(d.anchor.toFixed(2)) < 0) miss.push(k + d.label + ' anchor'); }));
    return { checked: 32, missing: miss };
  }

  document.getElementById('btnPng').addEventListener('click', exportPNG);
  document.getElementById('btnSvg').addEventListener('click', exportSVG);
  document.getElementById('csvIn').addEventListener('change', (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { DATA = buildFromRows(parseCSV(String(r.result))); render(); statusEl.textContent = 'CSV loaded: ' + f.name; } catch (e) { statusEl.textContent = 'CSV error: ' + e.message; } };
    r.readAsText(f);
  });
  window.PosterApp = { render, verifyBinding, stats, fullHash: () => E.fnv1a(cv.toDataURL('image/png')) + '-' + E.fnv1a(hud.innerHTML), getData: () => DATA, exportDataURL: async () => (await composite()).toDataURL('image/png') };
  render();
})();
</script>
