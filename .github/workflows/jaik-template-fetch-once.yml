name: One-time retrieve JAIK public HWP template
on: workflow_dispatch
permissions:
  contents: read
jobs:
  retrieve-public-template:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Download exact file from publisher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://www.aik.or.kr/downloads/pages/pages_submission/aik_journal_sample_20250218.hwp'
          curl --fail --location --retry 2 --connect-timeout 12 --max-time 95 --user-agent 'Mozilla/5.0 (compatible; PDF template verification)' --output out/aik_journal_sample_20250218.hwp "$URL"
          test "$(wc -c < out/aik_journal_sample_20250218.hwp)" -gt 1024
          file out/aik_journal_sample_20250218.hwp | tee out/source_signature.txt
          sha256sum out/aik_journal_sample_20250218.hwp | tee out/source_sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('out/aik_journal_sample_20250218.hwp')
          h = p.read_bytes()[:8]
          print('signature8 =', h.hex())
          if not (h.startswith(bytes.fromhex('d0cf11e0a1b11ae1')) or h.startswith(b'PK')):
              raise SystemExit('Unexpected signature: not HWP OLE or ZIP')
          PY
      - name: Convert template to PDF (do not alter HWP)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils
          timeout 100s libreoffice -env:UserInstallation=file:///tmp/jaik-lo-profile --headless --convert-to pdf --outdir out out/aik_journal_sample_20250218.hwp
          if test -s out/aik_journal_sample_20250218.pdf; then
            pdfinfo out/aik_journal_sample_20250218.pdf | head -25 | tee out/pdfinfo.txt
            pdftotext out/aik_journal_sample_20250218.pdf out/pdf_text.txt
          fi
      - name: Prepare isolated legacy HWP5 converter
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Extract HWP5 styles and experimental ODT/PDF
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/jaik-hwp-converter
          /tmp/jaik-hwp-converter/bin/python -m pip install --quiet --pre 'pyhwp==0.1b15' 'olefile==0.47' 'lxml==5.4.0' 'six==1.16.0'
          HWP='out/aik_journal_sample_20250218.hwp'
          /tmp/jaik-hwp-converter/bin/hwp5txt "$HWP" > out/hwp5_text.txt || true
          /tmp/jaik-hwp-converter/bin/hwp5proc xml "$HWP" > out/hwp5_structure.xml || true
          /tmp/jaik-hwp-converter/bin/hwp5odt --output=out/approximate_template.odt "$HWP" || true
          if test -s out/approximate_template.odt; then
            timeout 60s libreoffice -env:UserInstallation=file:///tmp/jaik-lo-pyhwp --headless --convert-to pdf --outdir out out/approximate_template.odt || true
            if test -s out/approximate_template.pdf; then
              pdfinfo out/approximate_template.pdf | tee out/approximate_pdfinfo.txt
              pdftotext out/approximate_template.pdf out/approximate_pdftotext.txt
            fi
          fi
      - name: Upload source and verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaik-official-hwp-one-time
          path: out/
          if-no-files-found: warn
          retention-days: 2
