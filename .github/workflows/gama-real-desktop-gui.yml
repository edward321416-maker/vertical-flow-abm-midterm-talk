name: Authentic GAMA Desktop GUI screenshot (virtual display)

on:
  push:
    branches: [research/real-gama-visual-proof-20261104]

permissions:
  contents: read

jobs:
  authentic-desktop-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout visual proof branch
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual X display and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth xdotool scrot libgtk-3-0 libxtst6 libxss1 libgl1 libgl1-mesa-dri mesa-utils libglu1-mesa xserver-xorg-core xserver-xorg-video-dummy

      - name: Download official GAMA 2025.06.4 and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gama-desktop
          curl -fsSL --retry 3 --connect-timeout 25 --max-time 230 \
            -o /tmp/gama-desktop/gama.deb \
            https://github.com/gama-platform/gama/releases/download/2025.06.4/GAMA_2025.06.4_Linux.deb
          echo "c787f16a0044a135debe925cf39f1642163894bb1471d07a91e9e8a048e3b497  /tmp/gama-desktop/gama.deb" | sha256sum -c -
          mkdir -p /tmp/gama-desktop/runtime
          dpkg-deb -x /tmp/gama-desktop/gama.deb /tmp/gama-desktop/runtime
          find /tmp/gama-desktop/runtime -name Gama -type f -print | tee /tmp/gama-desktop/launchers.txt
          test -s /tmp/gama-desktop/launchers.txt

      - name: Generate a real model input and launch GUI experiment
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/gama-desktop
          python3 simulation/visual_probe/prepare_case.py \
            "$BASE/case" "$GITHUB_WORKSPACE/simulation/visual_probe/vertical_flow_capture.gaml"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("simulation/visual_probe/vertical_flow_capture.gaml").read_text()
          original='string cell_file <- "";'
          assert source.count(original) == 1
          target = Path("/tmp/gama-desktop/case/inputs/cell.csv")
          assert target.exists()
          source = source.replace(original, f'string cell_file <- "{target}";')
          out = Path("/tmp/gama-desktop/visual_gui.gaml")
          out.write_text(source)
          print("Desktop experiment model:",out)
          PY
          # GUI captures only the 2D Java2D displays. JOGL OpenGL is not
          # required; that plugin segfaults inside glXQueryDrawable on the
          # ephemeral CI virtual server. Disable it ONLY in this extracted
          # disposable runtime, never in the user's installation or repo.
          mkdir -p "$BASE/disabled_opengl_bundle"
          for PLUGIN in "$BASE/runtime"/opt/gama-platform/plugins/gama.ui.display.opengl*; do
            if [ -e "$PLUGIN" ]; then
              mv "$PLUGIN" "$BASE/disabled_opengl_bundle/"
              echo "Disabled optional OpenGL bundle: $PLUGIN"
            fi
          done
          BUNDLES="$BASE/runtime/opt/gama-platform/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info"
          if [ -f "$BUNDLES" ]; then
            python3 - "$BUNDLES" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text().splitlines()
          skipped=[x for x in lines if x.startswith("gama.ui.display.opengl,")]
          p.write_text("\n".join(x for x in lines if x not in skipped)+"\n")
          print("Removed OpenGL-only OSGi entries:",skipped)
          PY
          fi
          mkdir -p "$BASE/screenshots"
          echo "GUI will prompt for its own workspace, preserving native GAMA initialization."
          cat > "$BASE/xorg-dummy.conf" <<'EOF'
          Section "ServerLayout"
            Identifier "Layout0"
            Screen 0 "Screen0" 0 0
          EndSection
          Section "Device"
            Identifier "Card0"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Monitor"
            Identifier "Monitor0"
            HorizSync 30-83
            VertRefresh 50-75
          EndSection
          Section "Screen"
            Identifier "Screen0"
            Device "Card0"
            Monitor "Monitor0"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1920x1080"
              Virtual 1920 1080
            EndSubSection
          EndSection
          EOF
          /usr/lib/xorg/Xorg :99 -noreset -config "$BASE/xorg-dummy.conf" -nolisten tcp -logfile "$BASE/xorg-server.log" > "$BASE/xvfb.log" 2>&1 &
          X_SERVER_PID=$!
          sleep 7
          if ! kill -0 "$X_SERVER_PID" 2>/dev/null; then
            echo "Xorg dummy server failed"
            tail -100 "$BASE/xorg-server.log" || true
            exit 10
          fi
          export DISPLAY=:99 GTK_THEME=Adwaita GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export JAVA_TOOL_OPTIONS="-Dsun.java2d.opengl=false"
          glxinfo -B > "$BASE/glxinfo.log" 2>&1 || { cat "$BASE/glxinfo.log"; exit 11; }
          sleep 4
          GUI="$(head -n1 "$BASE/launchers.txt")"
          chmod +x "$GUI"
          echo "GAMA GUI: model inside real Eclipse project; automatic visual experiment"
          PROJECT_DIR="$BASE/VerticalFlowVisualProof"
          mkdir -p "$PROJECT_DIR"
          cat > "$PROJECT_DIR/.project" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <projectDescription>
            <name>VerticalFlowVisualProof</name>
            <comment></comment>
            <projects></projects>
            <buildSpec></buildSpec>
            <natures></natures>
          </projectDescription>
          EOF
          python3 - "$BASE/visual_gui.gaml" "$PROJECT_DIR/vertical_flow_capture.gaml" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text()
          needle='experiment visual_capture type: gui {'
          assert src.count(needle)==1
          src=src.replace(needle,'experiment visual_capture type: gui autorun: true {\n    float minimum_cycle_duration <- 0.05 #s;')
          Path(sys.argv[2]).write_text(src)
          PY
          echo "PROJECT=$PROJECT_DIR/vertical_flow_capture.gaml"
          "$GUI" -clean "$PROJECT_DIR/vertical_flow_capture.gaml#visual_capture" > "$BASE/gui.log" 2>&1 &
          GUI_PID=$!
          echo "GAMA_PID=$GUI_PID"
          sleep 20
          scrot "$BASE/screenshots/workspace_dialog_initial.png"
          xdotool mousemove 856 478 click 1 key ctrl+a
          xdotool type --clearmodifiers --delay 4 "$BASE/native_workspace"
          xdotool mousemove 1197 588 click 1
          sleep 8
          scrot "$BASE/screenshots/workspace_after_enter_1.png"
          xdotool key Return
          sleep 38
          scrot "$BASE/screenshots/real_gama_experiment_initial.png"
          echo "WINDOWS:" | tee "$BASE/windows.txt"
          xdotool search --onlyvisible --name . getwindowname 2>/dev/null | tee -a "$BASE/windows.txt" || true
          sleep 17
          scrot "$BASE/screenshots/real_gama_experiment_running.png"
          xdotool search --onlyvisible --name Gama > "$BASE/window_ids.txt" 2>/dev/null || true
          if kill -0 "$GUI_PID" 2>/dev/null; then
            echo "GUI STILL ALIVE" | tee "$BASE/gui_status.txt"
          else
            echo "GUI EXITED" | tee "$BASE/gui_status.txt"
          fi
          kill "$GUI_PID" 2>/dev/null || true
          echo "Actual GAMA GUI capture step finished"

      - name: Upload raw untouched GUI screenshots and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gama-2025-06-4-authentic-desktop-x11
          path: |
            /tmp/gama-desktop/screenshots/*.png
            /tmp/gama-desktop/gui.log
            /tmp/gama-desktop/gui_bootstrap.log
            /tmp/gama-desktop/projects.txt
            /tmp/gama-desktop/glxinfo.log
            hs_err_pid*.log
            /tmp/gama-desktop/xvfb.log
            /tmp/gama-desktop/xorg-server.log
            /tmp/gama-desktop/xorg-dummy.conf
            /tmp/gama-desktop/windows.txt
            /tmp/gama-desktop/windows_before.txt
            /tmp/gama-desktop/window_ids.txt
            /tmp/gama-desktop/gui_status.txt
            /tmp/gama-desktop/launchers.txt
            /tmp/gama-desktop/case/inputs/cell.csv
          retention-days: 7
          if-no-files-found: warn
